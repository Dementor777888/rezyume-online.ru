<!-- @dsCard group="Spacing" viewport="700x160" name="Corner radii" subtitle="8 / 10 / 12 / pill" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;box-sizing:border-box;background:var(--bg-tint);font-family:var(--font-sans);}
.row{display:flex;gap:16px;align-items:center;}
.box{width:80px;height:80px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-secondary);}
</style></head>
<body>
<div class="row">
  <div class="box" style="border-radius:8px;">sm 8</div>
  <div class="box" style="border-radius:10px;">md 10</div>
  <div class="box" style="border-radius:12px;">lg 12</div>
  <div class="box" style="border-radius:999px;">pill</div>
</div>
</body></html>
