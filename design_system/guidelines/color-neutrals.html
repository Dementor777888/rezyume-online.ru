<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--font-sans);background:var(--bg);}
.row{display:flex;height:150px;}
.sw{flex:1;display:flex;align-items:flex-end;padding:10px;font-size:12px;box-sizing:border-box;border-right:1px solid #fff2;}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:#2B2B2B;color:#fff;">--ink #2B2B2B</div>
  <div class="sw" style="background:#5B6472;color:#fff;">--ink-secondary #5B6472</div>
  <div class="sw" style="background:#E4E7EC;color:#2B2B2B;">--line #E4E7EC</div>
  <div class="sw" style="background:#FFFFFF;color:#2B2B2B;border:1px solid #E4E7EC;">--bg #FFFFFF</div>
  <div class="sw" style="background:#F7FAF2;color:#2B2B2B;">--bg-tint #F7FAF2</div>
</div>
</body></html>
