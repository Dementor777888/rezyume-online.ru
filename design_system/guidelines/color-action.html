<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--font-sans);background:var(--bg);}
.row{display:flex;height:150px;}
.sw{flex:1;display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:12px;box-sizing:border-box;}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:#F5A623;">--brand-yellow #F5A623 (CTA)</div>
  <div class="sw" style="background:#E0921A;">--brand-yellow-dark #E0921A (hover)</div>
  <div class="sw" style="background:#4A9FD4;">--brand-blue #4A9FD4 (illustration only)</div>
</div>
</body></html>
