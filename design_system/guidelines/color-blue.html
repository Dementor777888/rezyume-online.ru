<!-- @dsCard group="Colors" viewport="700x150" name="Blue family" subtitle="Tint for panels/sidebars, deep for text on tint — raw blue is illustration-only" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--font-sans);background:var(--bg);}
.row{display:flex;height:150px;}
.sw{flex:1;display:flex;align-items:flex-end;padding:10px;font-size:12px;box-sizing:border-box;}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:#4A9FD4;color:#fff;">--brand-blue #4A9FD4 (illustration)</div>
  <div class="sw" style="background:#E4F1F9;color:#2B2B2B;">--brand-blue-tint #E4F1F9 (panel bg)</div>
  <div class="sw" style="background:#2D6685;color:#fff;">--brand-blue-deep #2D6685 (text on tint)</div>
</div>
</body></html>
