<!-- @dsCard group="Spacing" viewport="700x160" name="Elevation / shadows" subtitle="Soft, airy — sm / md / lg / brand" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;box-sizing:border-box;background:var(--bg-tint);font-family:var(--font-sans);}
.row{display:flex;gap:24px;}
.box{width:100px;height:80px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-secondary);}
</style></head>
<body>
<div class="row">
  <div class="box" style="box-shadow:var(--shadow-sm);">sm</div>
  <div class="box" style="box-shadow:var(--shadow-md);">md</div>
  <div class="box" style="box-shadow:var(--shadow-lg);">lg</div>
  <div class="box" style="box-shadow:var(--shadow-brand);">brand</div>
</div>
</body></html>
