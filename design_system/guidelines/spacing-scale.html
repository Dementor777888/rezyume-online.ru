<!-- @dsCard group="Spacing" viewport="700x180" name="8px grid scale" subtitle="--space-1 … --space-8" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;box-sizing:border-box;background:var(--bg);font-family:var(--font-sans);}
.row{display:flex;align-items:flex-end;gap:10px;}
.bar{background:var(--brand-green);}
.lbl{font-size:11px;color:var(--ink-secondary);margin-top:4px;text-align:center;}
.col{display:flex;flex-direction:column;align-items:center;}
</style></head>
<body>
<div class="row">
  <div class="col"><div class="bar" style="width:16px;height:4px;"></div><div class="lbl">4</div></div>
  <div class="col"><div class="bar" style="width:16px;height:8px;"></div><div class="lbl">8</div></div>
  <div class="col"><div class="bar" style="width:16px;height:16px;"></div><div class="lbl">16</div></div>
  <div class="col"><div class="bar" style="width:16px;height:24px;"></div><div class="lbl">24</div></div>
  <div class="col"><div class="bar" style="width:16px;height:32px;"></div><div class="lbl">32</div></div>
  <div class="col"><div class="bar" style="width:16px;height:48px;"></div><div class="lbl">48</div></div>
  <div class="col"><div class="bar" style="width:16px;height:64px;"></div><div class="lbl">64</div></div>
  <div class="col"><div class="bar" style="width:16px;height:96px;"></div><div class="lbl">96</div></div>
</div>
</body></html>
