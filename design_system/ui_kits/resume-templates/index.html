<!-- @dsCard group="Resume Templates" viewport="1180x760" name="Resume template gallery" subtitle="2 бесплатных + 5 премиальных шаблонов" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Резюме Онлайн — шаблоны резюме</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-tint); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>

<script>window.DS = window.DesignSystem_7c7421;</script>
<script src="resumeData.js"></script>
<script type="text/babel" src="templateParts.jsx"></script>
<script type="text/babel" src="TemplateStart.jsx"></script>
<script type="text/babel" src="TemplateStartPhoto.jsx"></script>
<script type="text/babel" src="TemplateClean.jsx"></script>
<script type="text/babel" src="TemplateCompact.jsx"></script>
<script type="text/babel" src="TemplateOneColumn.jsx"></script>
<script type="text/babel" src="TemplateAcademic.jsx"></script>
<script type="text/babel" src="TemplateAccent.jsx"></script>

<script type="text/babel">
const { useState } = React;

const TEMPLATES = [
  { id: '0a', name: '«Старт» (без фото)', tier: 'free', render: () => <window.TemplateStart /> },
  { id: '0b', name: '«Старт+фото»', tier: 'free', render: () => <window.TemplateStartPhoto /> },
  { id: '1', name: '«Чистый»', tier: 'paid', accents: ['blue', 'teal', 'graphite'], defaultAccent: 'blue', render: (acc) => <window.TemplateClean accent={acc || 'blue'} /> },
  { id: '2', name: '«Компакт»', tier: 'paid', accents: ['teal', 'blue', 'graphite'], defaultAccent: 'teal', render: (acc) => <window.TemplateCompact accent={acc || 'teal'} /> },
  { id: '3', name: '«Одна колонка» (ATS)', tier: 'paid', accents: ['graphite', 'blue', 'teal'], defaultAccent: 'graphite', render: (acc) => <window.TemplateOneColumn accent={acc || 'graphite'} /> },
  { id: '4', name: '«Академический»', tier: 'paid', render: () => <window.TemplateAcademic /> },
  { id: '5', name: '«Акцент»', tier: 'paid', accents: ['blue', 'teal', 'graphite'], defaultAccent: 'blue', render: (acc) => <window.TemplateAccent accent={acc || 'blue'} /> },
];

function Thumb({ t, active, onClick }) {
  return (
    <div onClick={onClick} style={{ cursor: 'pointer', display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'center' }}>
      <div style={{
        width: 128, height: 181, overflow: 'hidden', borderRadius: 8,
        border: active ? '2px solid var(--brand-green)' : '1px solid var(--line)',
        boxShadow: active ? 'var(--shadow-brand)' : 'var(--shadow-sm)',
        background: '#fff', position: 'relative',
      }}>
        <div style={{ width: 620, height: 876, transform: 'scale(0.2065)', transformOrigin: 'top left' }}>
          {t.render()}
        </div>
      </div>
      <div style={{ fontSize: 12, textAlign: 'center', color: 'var(--ink)', fontWeight: active ? 700 : 500, lineHeight: 1.3 }}>
        {t.name}
        <div style={{ marginTop: 3 }}>
          <window.DS.Badge tone={t.tier === 'free' ? 'brand' : 'paid'}>{t.tier === 'free' ? 'Бесплатно' : 'PRO'}</window.DS.Badge>
        </div>
      </div>
    </div>
  );
}

function AccentChips({ accents, value, onChange }) {
  return (
    <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
      <span style={{ fontSize: 11.5, color: 'var(--ink-secondary)' }}>Акцент:</span>
      {accents.map((key) => {
        const a = window.PAID_ACCENTS[key];
        const isActive = key === value;
        return (
          <button
            key={key}
            onClick={() => onChange(key)}
            title={a.label}
            style={{
              width: 22, height: 22, borderRadius: '50%', cursor: 'pointer',
              background: a.solid,
              border: isActive ? '2px solid var(--ink)' : '2px solid transparent',
              outline: isActive ? '2px solid #fff' : 'none', outlineOffset: -4,
            }}
          ></button>
        );
      })}
    </div>
  );
}

function Gallery() {
  const [activeId, setActiveId] = useState('0a');
  const [accents, setAccents] = useState({});
  const active = TEMPLATES.find((t) => t.id === activeId);
  const activeAccent = accents[activeId] || active.defaultAccent;
  return (
    <div style={{ display: 'flex', height: '100vh' }}>
      <div style={{ width: 200, borderRight: '1px solid var(--line)', background: '#fff', padding: '20px 14px', overflowY: 'auto', flexShrink: 0 }}>
        <div style={{ fontFamily: 'var(--font-serif-display)', fontSize: 18, fontWeight: 600, marginBottom: 4, color: 'var(--ink)' }}>Резюме Онлайн</div>
        <div style={{ fontSize: 11.5, color: 'var(--ink-secondary)', marginBottom: 18 }}>2 бесплатных + 5 премиальных шаблонов</div>
        <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--ink-secondary)', textTransform: 'uppercase', letterSpacing: '0.05em', margin: '4px 0 10px' }}>Бесплатные</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 18, marginBottom: 22 }}>
          {TEMPLATES.filter((t) => t.tier === 'free').map((t) => (
            <Thumb key={t.id} t={t} active={t.id === activeId} onClick={() => setActiveId(t.id)} />
          ))}
        </div>
        <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--ink-secondary)', textTransform: 'uppercase', letterSpacing: '0.05em', margin: '4px 0 10px' }}>Премиальные</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
          {TEMPLATES.filter((t) => t.tier === 'paid').map((t) => (
            <Thumb key={t.id} t={t} active={t.id === activeId} onClick={() => setActiveId(t.id)} />
          ))}
        </div>
      </div>
      <div style={{ flex: 1, overflowY: 'auto', display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '32px 20px', gap: 14 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, flexWrap: 'wrap', justifyContent: 'center' }}>
          <div style={{ fontSize: 15, fontWeight: 700, color: 'var(--ink)' }}>{active.name}</div>
          <window.DS.Badge tone={active.tier === 'free' ? 'brand' : 'paid'}>{active.tier === 'free' ? 'Бесплатно' : 'PRO'}</window.DS.Badge>
          {active.accents && (
            <AccentChips
              accents={active.accents}
              value={activeAccent}
              onChange={(key) => setAccents({ ...accents, [activeId]: key })}
            />
          )}
        </div>
        {active.render(activeAccent)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Gallery />);
</script>
</body>
</html>
